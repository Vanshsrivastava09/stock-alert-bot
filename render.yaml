services:
  - type: web
    name: stock-alert-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stock-alert-db
          property: connectionString

databases:
  - name: stock-alert-db
    databaseName: stock_alerts
    user: stock_alert_user
